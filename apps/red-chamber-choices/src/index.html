<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c9bf99">
  <title>红楼拾章 · 林黛玉</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./story-data.js"></script>
  <script defer src="./story.js"></script>
  <script defer src="./paper-pieces.js"></script>
  <script defer src="./paper-world.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main class="game" id="game" data-world="map">
    <canvas id="world" aria-hidden="true"></canvas>
    <div class="book-fold" aria-hidden="true"></div>
    <header class="game-hud" aria-label="游戏操作">
      <button class="hud-key map-key" type="button" id="home" disabled hidden>← 游园图</button>
      <span class="wordmark" id="wordmark">红楼拾章</span>
      <button class="hud-key" type="button" id="collection" disabled>徽章 <span id="badge-count">0 / 4</span></button>
    </header>
    <section class="view" id="map-view" aria-labelledby="map-title">
      <div class="map-heading">
        <p class="setting">林黛玉篇</p>
        <h1 id="map-title" tabindex="-1">大观园游记</h1>
      </div>
      <div class="pins" id="pins" aria-label="游园地图的故事地点"></div>
      <div class="map-legend">
        <p id="progress">已点亮 0 / 4</p>
        <progress id="map-completion" class="paper-progress" value="0" max="4" aria-label="地图点亮进度"></progress>
        <p id="map-hint" aria-live="polite">点亮第一处地标，开始故事。</p>
        <button type="button" class="action" id="view-ending" hidden>翻阅尾声 →</button>
        <noscript><p>启用 JavaScript 后即可进入游园图。</p></noscript>
      </div>
    </section>
    <section class="view" id="scene-view" aria-labelledby="scene-title" hidden>
      <div class="scene-heading">
        <p class="setting" id="chapter"></p>
        <h1 id="scene-title" tabindex="-1"></h1>
      </div>
      <div class="scene-paper" id="scene-paper"></div>
    </section>
    <section class="view overlay-view" id="result-view" aria-labelledby="result-title" hidden></section>
    <section class="view overlay-view" id="badge-view" aria-labelledby="badge-title" hidden></section>
    <p id="storage-status" class="storage-status" role="status" hidden></p>
  </main>
</body>
</html>
